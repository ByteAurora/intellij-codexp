guide.notice.intro.title=CodeXP 시작하기
guide.notice.intro.body=경험치, 챌린지, 컬렉션과 효과를 간단히 살펴보세요. 대시보드의 정보 아이콘이나 도구 메뉴에서 다시 열 수 있습니다.
guide.notice.update.title=CodeXP {0} 업데이트
guide.notice.update.body=새로운 기능이 추가되었습니다. 마지막으로 확인한 안내 이후의 변경 사항을 살펴보세요.
guide.notice.open=안내 보기
guide.notice.dismiss=다시 알리지 않기
guide.xp.title=작업하면서 쌓이는 경험치
guide.xp.body=타이핑, 편집, 저장, 빌드와 디버깅으로 경험치가 쌓입니다. 대시보드에서 레벨과 진행도를 확인할 수 있습니다. 타이핑 경험치는 커서 근처에, 메뉴나 버튼 동작의 경험치는 IDE 하단에 표시됩니다.
guide.challenges.title=챌린지 진행 상황 확인
guide.challenges.body=활동마다 목표와 경험치 보상이 있는 챌린지가 있습니다. 가장 최근에 진행한 챌린지가 위로 올라옵니다. 기록 탭에서 완료한 챌린지를, 활동 탭에서 활동별 횟수를 확인할 수 있습니다.
guide.collection.title=인장과 칭호 수집
guide.collection.body=레벨과 챌린지 달성으로 인장과 칭호가 열립니다. 컬렉션에서 보유 항목과 획득 조건을 확인하세요. 아직 얻지 못한 항목의 모습은 숨겨져 있습니다. 항목을 눌러 살펴보고, 장착을 누르면 실제로 적용됩니다.
guide.credits.title=원하는 항목을 선택
guide.credits.body=티켓 아이콘 옆 숫자가 보유한 선택권입니다. Lv.{0}부터 선택권으로 획득 가능한 컬렉션 항목을 고를 수 있습니다. 획득 후 장착은 별도로 선택합니다. 만렙 이후 첫 선택권은 {1} XP가 필요하며, 다음부터 {2} XP씩 늘어나 최대 {3} XP가 필요합니다. 선택권은 꾸미기 전용으로, 경험치나 레벨을 구매하지 않습니다.
guide.mini.title=인장을 항상 가까이에
guide.mini.body=대시보드를 닫아도 미니 인장은 IDE에 남습니다. 드래그로 이동하고 우클릭으로 크기와 표시 방법을 바꿀 수 있습니다. 설정에서 절제형·화려형 효과를 선택하거나 움직임을 줄이고, 미니 인장을 끌 수 있습니다.
guide.growth.title=Lv.150 이후에도 계속
guide.growth.body=만렙은 {0}이며, 레벨업에 필요한 경험치가 늘었습니다. 기존 경험치, 완료한 챌린지와 수집 기록은 보존됩니다. 이전 레벨 진행도는 획득 경험치를 늘리지 않고 별도 보정으로 반영됩니다. 경험치가 있는 기존 사용자에게는 선택권 1개를 한 번 지급합니다. 만렙 이후에도 경험치를 쌓아 선택권을 얻을 수 있습니다.
