settings.history.reset.title=닉네임을 제외한 모든 데이터를 초기화할까요?
settings.history.reset.message=모든 CodeXP 데이터와 설정을 즉시 초기화합니다. 이 작업은 되돌릴 수 없습니다.\n\n총 XP와 레벨, 챌린지 단계, 진행도, 보상, 완료 기록, 활동 통계, 최근 이벤트 순서 및 CodeXP 설정이 초기값으로 돌아갑니다. 대기 중인 효과도 취소됩니다.\n\n닉네임은 유지됩니다. 프로젝트 파일, 소스 코드, IDE 설정은 변경되지 않습니다.\n\n지금 모든 CodeXP 데이터와 설정을 초기화할까요?
settings.history.reset.description=CodeXP를 초기 상태로 되돌리며 닉네임은 유지합니다. 프로젝트 파일, 소스 코드, IDE 설정은 변경되지 않습니다.
