settings.history.reset.title=Reset everything except your nickname?
settings.history.reset.message=This immediately resets all CodeXP data and settings except your nickname. This cannot be undone.\n\nTotal XP and level, all challenge stages, progress, rewards, completion history, Activity statistics, recent-event order, and CodeXP preferences return to their initial defaults. Pending effects are cancelled.\n\nYour nickname is kept. Project files, source code, and IDE settings are not changed.\n\nReset all CodeXP data and settings now?
settings.history.reset.description=Start CodeXP over from its defaults. Only your nickname is kept. Project files, source code, and IDE settings are not changed.
