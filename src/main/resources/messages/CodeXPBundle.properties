guide.notice.intro.title=Welcome to CodeXP
guide.notice.intro.body=A quick guide to XP, challenges, collections and effects. You can reopen it from the dashboard information icon or the Tools menu.
guide.notice.update.title=CodeXP {0} updates
guide.notice.update.body=New features are available. Review the changes since your last update guide.
guide.notice.open=View guide
guide.notice.dismiss=Don't show again
guide.xp.title=Your work earns XP
guide.xp.body=Typing, editing, saving, building and debugging earn XP automatically. The dashboard shows your level and progress. Typing XP appears near the caret; menu and button actions appear at the bottom of the IDE.
guide.challenges.title=Track your challenges
guide.challenges.body=Each activity has a challenge with a target and an XP reward. The most recently updated challenge moves to the top. History keeps completed challenges, and Activity shows your counts.
guide.collection.title=Collect crests and titles
guide.collection.body=Level milestones and completed challenges unlock crests and titles. Browse the collection to see owned items and unlock conditions. Locked items keep their artwork hidden. Select an item to inspect it, then choose Equip to use it.
guide.credits.title=A choice of your own
guide.credits.body=The ticket icon shows your choice credits. At Lv.{0}, spend a credit on an eligible collection item, then equip it separately. After the level cap, the first earned credit needs {1} XP; each subsequent threshold rises by {2} XP, up to {3} XP. Credits buy cosmetics only, not XP or levels.
guide.mini.title=Keep your crest in view
guide.mini.body=The mini crest stays in the IDE even with the dashboard closed. Drag it to move it and right-click for size and display options. In Settings, choose subtle or celebratory effects, reduce motion, or turn the mini crest off.
guide.growth.title=Progress beyond Lv.150
guide.growth.body=The level cap is now {0}, with a slower level curve. Existing XP, completed challenges and earned collections are kept; past level progress receives an offset rather than extra earned XP. Existing profiles with XP also receive a one-time choice credit. Beyond the cap, XP continues toward choice credits.
