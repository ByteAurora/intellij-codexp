name: Bug report
description: Report a reproducible CodeXP issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: CodeXP version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: ide-version
    attributes:
      label: IDE and version
      placeholder: "IntelliJ IDEA 2026.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots

