name: Plugin compatibility

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Verify IDE ${{ matrix.ide }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        ide:
          - '233.15619.7'
          - '241.19416.15'
          - '242.26775.15'
          - '243.28141.41'
          - '251.29188.72'
          - '252.28539.97'
          - '253.33813.55'
          - '261.27258.48'
          - '262.10968.63'
          - '262.9437.185'
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Verify plugin
        env:
          VERIFICATION_IDE: ${{ matrix.ide }}
        run: ./gradlew verifyPlugin -PverificationIde="$VERIFICATION_IDE"

      - name: Upload verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-${{ matrix.ide }}
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
