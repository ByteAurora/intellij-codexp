name: Release Draft

on:
  workflow_dispatch:
    inputs:
      ref:
        description: main or a full commit SHA already merged into main
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  release-draft:
    name: Create release draft
    if: ${{ github.repository == 'ByteAurora/intellij-codexp' && github.actor == 'ByteAurora' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release commit and version
        id: metadata
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: python3 .github/scripts/release_metadata.py draft --ref "$RELEASE_REF"

      - name: Check out validated commit
        env:
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Create release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          if IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"; then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $RELEASE_TAG is already published."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTE"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTE"
          fi
