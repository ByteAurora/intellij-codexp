name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check, package, and verify plugin
        run: ./gradlew check koverXmlReport buildPlugin verifyPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: intellij-codexp-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: build/reports/tests
          if-no-files-found: ignore

      - name: Upload plugin verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore

      - name: Upload coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v6
        with:
          files: build/reports/kover/report.xml
          token: ${{ env.CODECOV_TOKEN }}

  release-draft:
    name: Release draft
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Create release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')"
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "v${VERSION}" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release v${VERSION} already exists and is not a draft."
              exit 1
            fi
            gh release delete "v${VERSION}" --cleanup-tag --yes
          fi

          gh release create "v${VERSION}" \
            --draft \
            --title "v${VERSION}" \
            --notes-file "$RELEASE_NOTE"
